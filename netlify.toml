# The repository is flat (all files side by side, easy to upload on GitHub).
# During the build Netlify sorts them into the usual layout:
#   site/               -> the pages people see
#   netlify/functions/  -> the server part (accounts, threads, messages, admin)
[build]
  command = "mkdir -p site netlify/functions && cp *.html *.png site/ && cp *.mjs netlify/functions/ && ls site netlify/functions"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
