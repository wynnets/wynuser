# Everything sits in one folder: pages and server functions side by side.
[build]
  publish = "."
  functions = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
